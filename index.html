
<!-- INTRO DE BURBUJAS -->
<div class="bubble-intro" id="bubbleIntro">
  <div class="bubble-heading">
    <p>FLORENCIA PIMENTEL · EAD PUCV</p>
    <h2>Un momento para explorar.</h2>
    <span>Mueve el cursor y descubre lo que hay detrás.</span>
  </div>

  <div class="bubble-field" id="bubbleField"></div>

  <button class="skip-intro" id="skipIntro" type="button">
    Saltar intro <span aria-hidden="true">↗</span>
  </button>
</div>

<style>
  .bubble-intro {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #1749c5;
    color: #fff;
    transition: opacity 500ms ease, visibility 500ms ease;
  }

  .bubble-intro.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .bubble-heading {
    position: relative;
    z-index: 2;
    width: min(90%, 650px);
    text-align: center;
    pointer-events: none;
  }

  .bubble-heading p {
    margin-bottom: 24px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .16em;
  }

  .bubble-heading h2 {
    margin: 0 0 16px;
    font-size: clamp(32px, 6vw, 66px);
    font-weight: 600;
    letter-spacing: -.07em;
    line-height: 1.05;
  }

  .bubble-heading span {
    color: #dce6ff;
    font-size: 12px;
    line-height: 1.8;
  }

  .bubble-field {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .bubble {
    position: absolute;
    display: block;
    padding: 0;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    pointer-events: auto;
    background: #315fe0;
    animation: bubbleFloat var(--duration, 7s) ease-in-out infinite alternate;
    transition: opacity 180ms ease, transform 180ms ease;
    -webkit-tap-highlight-color: transparent;
  }

  .bubble:nth-child(3n + 1) {
    background: #315fe0;
  }

  .bubble:nth-child(3n + 2) {
    background: #6288f5;
  }

  .bubble:nth-child(3n) {
    background: #0c35a2;
  }

  .bubble.popped {
    opacity: 0;
    transform: scale(1.12);
    pointer-events: none;
  }

  @keyframes bubbleFloat {
    from {
      translate: 0 0;
    }

    to {
      translate: 0 -12px;
    }
  }

  .skip-intro {
    position: absolute;
    z-index: 5;
    right: 28px;
    bottom: 28px;
    padding: 13px 18px;
    border: 1px solid #fff;
    border-radius: 30px;
    background: #fff;
    color: #1749c5;
    font: 600 11px "Montserrat", sans-serif;
    cursor: pointer;
  }

  .skip-intro:hover {
    background: #dce6ff;
  }

  @media (max-width: 600px) {
    .bubble-heading {
      width: 84%;
    }

    .bubble-heading h2 {
      font-size: 39px;
    }

    .skip-intro {
      right: 18px;
      bottom: 18px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .bubble {
      animation: none;
    }

    .bubble-intro {
      transition-duration: 0.01ms;
    }
  }
</style>

<script>
  (() => {
    const intro = document.getElementById("bubbleIntro");
    const field = document.getElementById("bubbleField");
    const skip = document.getElementById("skipIntro");

    if (!intro || !field || !skip) return;

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    let closed = false;

    function closeIntro() {
      if (closed) return;

      closed = true;
      intro.classList.add("is-hidden");

      window.setTimeout(() => {
        intro.remove();
      }, 550);
    }

    skip.addEventListener("click", closeIntro);

    const bubbleCount = reducedMotion ? 18 : 42;

    for (let i = 0; i < bubbleCount; i++) {
      const bubble = document.createElement("button");

      bubble.type = "button";
      bubble.className = "bubble";
      bubble.setAttribute("aria-label", "Reventar burbuja");

      const size = 45 + Math.random() * 100;
      const x = Math.random() * 100;
      const y = Math.random() * 100;
      const duration = 4 + Math.random() * 6;

      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;
      bubble.style.left = `${x}%`;
      bubble.style.top = `${y}%`;
      bubble.style.setProperty("--duration", `${duration}s`);
      bubble.style.animationDelay = `${Math.random() * -6}s`;

      let popped = false;

      function popBubble() {
        if (popped || closed) return;

        popped = true;
        bubble.classList.add("popped");

        window.setTimeout(() => {
          bubble.remove();

          if (!closed && field.children.length === 0) {
            closeIntro();
          }
        }, 190);
      }

      bubble.addEventListener("pointerenter", (event) => {
        if (event.pointerType === "mouse") {
          popBubble();
        }
      });

      bubble.addEventListener("click", popBubble);

      field.appendChild(bubble);
    }
  })();
</script>
